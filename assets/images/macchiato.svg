<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8D9CC"/>
      <stop offset="1" stop-color="#C5AA95"/>
    </linearGradient>

    <linearGradient id="table" x1="0" y1="375" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#694735"/>
      <stop offset="1" stop-color="#36231A"/>
    </linearGradient>

    <linearGradient id="glass" x1="330" y1="235" x2="480" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF8" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#D7C7BA" stop-opacity="0.58"/>
    </linearGradient>

    <linearGradient id="coffee" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9A623C"/>
      <stop offset="1" stop-color="#4A2A1D"/>
    </linearGradient>

    <linearGradient id="milk" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFF5E6"/>
      <stop offset="1" stop-color="#E8D3BD"/>
    </linearGradient>

    <linearGradient id="caramel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D28A45"/>
      <stop offset="1" stop-color="#8A4B25"/>
    </linearGradient>

    <radialGradient id="light" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(145 125) rotate(48) scale(390 310)">
      <stop stop-color="#FFF9EF" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#FFF9EF" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="220" y="360" width="360" height="140" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="glassShadow" x="285" y="230" width="250" height="250" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#background)"/>
  <rect width="800" height="600" fill="url(#light)"/>

  <!-- Window -->
  <rect x="70" y="65" width="220" height="225" rx="4" fill="#F8F0E7" fill-opacity="0.52"/>
  <rect x="93" y="88" width="174" height="179" fill="#B8C6C0" fill-opacity="0.24"/>
  <path d="M180 88V267" stroke="#FFF8EF" stroke-width="8" stroke-opacity="0.62"/>
  <path d="M93 177H267" stroke="#FFF8EF" stroke-width="8" stroke-opacity="0.62"/>

  <!-- Wall accent -->
  <circle cx="665" cy="125" r="78" fill="#A8795C" fill-opacity="0.12"/>
  <circle cx="665" cy="125" r="48" fill="#FFF6E9" fill-opacity="0.2"/>

  <!-- Small plant -->
  <path d="M630 294C626 256 633 223 650 194"
        stroke="#59694D" stroke-width="6" stroke-linecap="round"/>

  <path d="M645 219C621 211 609 195 610 180C628 181 642 194 645 219Z"
        fill="#687957"/>

  <path d="M639 240C658 226 675 224 689 230C682 247 663 252 639 240Z"
        fill="#768664"/>

  <path d="M632 261C613 250 602 238 600 223C617 224 630 237 632 261Z"
        fill="#526549"/>

  <path d="M652 201C657 183 670 170 684 168C684 185 671 198 652 201Z"
        fill="#7D8C6A"/>

  <path d="M607 286H683L672 351H618L607 286Z" fill="#A56B4A"/>
  <ellipse cx="645" cy="286" rx="38" ry="10" fill="#774D38"/>

  <!-- Table -->
  <rect y="375" width="800" height="225" fill="url(#table)"/>
  <path d="M0 412C160 394 300 430 465 412C610 396 715 404 800 420"
        stroke="#8B6047" stroke-width="3" stroke-opacity="0.45"/>
  <path d="M0 493C178 474 320 507 491 488C630 472 716 481 800 494"
        stroke="#8B6047" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Main shadow -->
  <ellipse cx="400" cy="455" rx="145" ry="36"
           fill="#1D120D" fill-opacity="0.42" filter="url(#shadow)"/>

  <!-- Saucer -->
  <ellipse cx="400" cy="435" rx="145" ry="48" fill="#DED3CA"/>
  <ellipse cx="400" cy="429" rx="133" ry="42" fill="#FFFDF9"/>
  <ellipse cx="400" cy="426" rx="108" ry="29" fill="#F0E7DF"/>

  <!-- Glass shadow -->
  <ellipse cx="400" cy="383" rx="104" ry="48"
           fill="#3A2419" fill-opacity="0.3" filter="url(#glassShadow)"/>

  <!-- Glass body -->
  <path d="M320 245
           C322 232 334 225 350 225
           H450
           C466 225 478 232 480 245
           L468 390
           C465 420 441 437 400 437
           C359 437 335 420 332 390
           L320 245Z"
        fill="url(#glass)"
        stroke="#F7F0E8"
        stroke-width="4"
        stroke-opacity="0.7"/>

  <!-- Glass highlights -->
  <path d="M337 256L348 384"
        stroke="#FFFFFF"
        stroke-width="8"
        stroke-linecap="round"
        stroke-opacity="0.28"/>

  <path d="M463 260L452 385"
        stroke="#FFFFFF"
        stroke-width="5"
        stroke-linecap="round"
        stroke-opacity="0.2"/>

  <!-- Milk base -->
  <path d="M331 350L337 391C340 416 363 428 400 428C437 428 460 416 463 391L469 350H331Z"
        fill="url(#milk)"
        fill-opacity="0.95"/>

  <!-- Espresso layer -->
  <path d="M329 303H471L467 351H333L329 303Z"
        fill="url(#coffee)"/>

  <!-- Espresso gradient bands -->
  <path d="M331 303H469V316H331V303Z"
        fill="#B77A4D"
        fill-opacity="0.62"/>

  <path d="M332 319H468V337H332V319Z"
        fill="#704128"
        fill-opacity="0.7"/>

  <path d="M333 339H467V351H333V339Z"
        fill="#B77A4D"
        fill-opacity="0.5"/>

  <!-- Milk layer -->
  <path d="M329 352H471L467 365H333L329 352Z"
        fill="#FFF4E1"
        fill-opacity="0.92"/>

  <!-- Espresso top -->
  <ellipse cx="400" cy="294" rx="71" ry="23" fill="#75452D"/>
  <ellipse cx="400" cy="290" rx="62" ry="17" fill="#9A603B"/>

  <!-- Foam -->
  <path d="M347 292C360 279 380 278 400 288C420 278 440 279 453 292C443 304 424 308 400 302C376 308 357 304 347 292Z"
        fill="#E8CDB1"/>

  <!-- Caramel drizzle -->
  <path d="M355 282C369 287 378 293 389 286C400 279 410 289 420 294C430 299 441 292 448 286"
        stroke="url(#caramel)"
        stroke-width="7"
        stroke-linecap="round"/>

  <path d="M368 300C379 294 388 298 397 304C406 310 418 305 428 300"
        stroke="#C47737"
        stroke-width="5"
        stroke-linecap="round"
        stroke-opacity="0.85"/>

  <!-- Caramel on glass -->
  <path d="M344 318C360 325 377 322 390 328C404 334 420 330 436 322"
        stroke="#B96C32"
        stroke-width="5"
        stroke-linecap="round"
        stroke-opacity="0.55"/>

  <path d="M356 344C370 350 386 346 400 352C414 358 429 354 442 348"
        stroke="#D28A45"
        stroke-width="4"
        stroke-linecap="round"
        stroke-opacity="0.45"/>

  <!-- Straw -->
  <path d="M447 235L492 174"
        stroke="#604335"
        stroke-width="8"
        stroke-linecap="round"/>

  <path d="M448 235L493 174"
        stroke="#D6B59A"
        stroke-width="3"
        stroke-linecap="round"
        stroke-opacity="0.55"/>

  <!-- Steam -->
  <path d="M370 235C360 219 371 207 367 194C363 183 369 173 379 165"
        stroke="#FFF8EF"
        stroke-width="5"
        stroke-linecap="round"
        stroke-opacity="0.5"/>

  <path d="M400 232C390 217 402 205 398 193C395 183 400 174 410 166"
        stroke="#FFF8EF"
        stroke-width="4"
        stroke-linecap="round"
        stroke-opacity="0.42"/>

  <!-- Coffee beans -->
  <g opacity="0.68">
    <ellipse cx="188" cy="450" rx="14" ry="8"
             transform="rotate(-27 188 450)" fill="#4A2B1F"/>
    <path d="M179 453C186 448 193 446 199 447"
          stroke="#A87859" stroke-width="2"/>

    <ellipse cx="620" cy="470" rx="14" ry="8"
             transform="rotate(22 620 470)" fill="#4A2B1F"/>
    <path d="M611 467C618 470 624 471 630 469"
          stroke="#A87859" stroke-width="2"/>
  </g>

  <!-- Caramel bottle detail -->
  <g opacity="0.8">
    <rect x="575" y="410" width="38" height="55" rx="5" fill="#8B4E2A"/>
    <rect x="583" y="398" width="22" height="15" rx="3" fill="#4A3024"/>
    <path d="M583 427H605"
          stroke="#E2B078" stroke-width="4" stroke-linecap="round"/>
    <path d="M583 440H600"
          stroke="#E2B078" stroke-width="3" stroke-linecap="round" stroke-opacity="0.75"/>
  </g>

  <!-- Small spoon -->
  <g opacity="0.72">
    <path d="M238 405L298 460"
          stroke="#D8D0C8" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="230" cy="398" rx="14" ry="10"
             transform="rotate(42 230 398)"
             fill="#E9E1D9"/>
  </g>

  <!-- Foreground texture -->
  <path d="M65 550C175 531 250 566 355 551C475 534 565 570 735 545"
        stroke="#98684D" stroke-width="2" stroke-opacity="0.23"/>

  <!-- Ambient highlight -->
  <ellipse cx="400" cy="225" rx="185" ry="95"
           fill="#FFF5E6" fill-opacity="0.06"/>
</svg>