<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 600"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">MOLA Latte illüstrasyonu</title>

  <desc id="desc">
    Sıcak kahve tonlarında seramik fincan içinde latte
    ve latte art bulunan modern editorial SVG illüstrasyonu.
  </desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ead8c6"/>
      <stop offset="100%" stop-color="#b98561"/>
    </linearGradient>

    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#70442d"/>
      <stop offset="100%" stop-color="#352015"/>
    </linearGradient>

    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#d8c8b8"/>
    </linearGradient>

    <radialGradient id="coffee">
      <stop offset="0%" stop-color="#9c6040"/>
      <stop offset="70%" stop-color="#6a3824"/>
      <stop offset="100%" stop-color="#3a1d12"/>
    </radialGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#fff2dc" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#fff2dc" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect
    width="800"
    height="600"
    fill="url(#bg)"
  />

  <!-- Soft window light -->
  <ellipse
    cx="590"
    cy="150"
    rx="300"
    ry="250"
    fill="url(#glow)"
  />

  <!-- Minimal background architectural detail -->
  <rect
    x="80"
    y="75"
    width="230"
    height="175"
    rx="10"
    fill="#fff8ef"
    opacity=".2"
  />

  <rect
    x="105"
    y="100"
    width="180"
    height="125"
    fill="#6b4a37"
    opacity=".13"
  />

  <!-- Small plant -->
  <g opacity=".55">

    <path
      d="M175 235 C165 190 178 155 195 125"
      fill="none"
      stroke="#4e392b"
      stroke-width="8"
      stroke-linecap="round"
    />

    <ellipse
      cx="180"
      cy="165"
      rx="28"
      ry="13"
      fill="#526247"
      transform="rotate(-35 180 165)"
    />

    <ellipse
      cx="190"
      cy="135"
      rx="26"
      ry="12"
      fill="#687653"
      transform="rotate(25 190 135)"
    />

    <ellipse
      cx="160"
      cy="195"
      rx="25"
      ry="12"
      fill="#59694b"
      transform="rotate(-25 160 195)"
    />

  </g>

  <!-- Table -->
  <path
    d="M0 385
       C180 365 350 370 520 385
       C630 395 720 390 800 378
       L800 600
       L0 600 Z"
    fill="url(#table)"
  />

  <!-- Table highlight -->
  <path
    d="M0 410
       C200 390 380 400 540 410
       C650 417 730 412 800 402"
    fill="none"
    stroke="#a06b49"
    stroke-width="7"
    opacity=".35"
  />

  <!-- Saucer shadow -->
  <ellipse
    cx="420"
    cy="470"
    rx="215"
    ry="48"
    fill="#1b0e09"
    opacity=".55"
    filter="url(#shadow)"
  />

  <!-- Saucer -->
  <ellipse
    cx="420"
    cy="455"
    rx="190"
    ry="42"
    fill="#cbb9a8"
  />

  <ellipse
    cx="420"
    cy="447"
    rx="165"
    ry="34"
    fill="#f4eee6"
  />

  <!-- Cup shadow -->
  <ellipse
    cx="420"
    cy="447"
    rx="150"
    ry="28"
    fill="#8c6a53"
    opacity=".28"
  />

  <!-- Cup -->
  <path
    d="M275 270
       C278 240 305 225 345 225
       L495 225
       C535 225 562 240 565 270
       L550 405
       C545 438 518 455 480 460
       L360 460
       C322 455 295 438 290 405 Z"
    fill="url(#cup)"
  />

  <!-- Cup subtle highlight -->
  <path
    d="M315 275
       C320 255 335 245 360 242"
    fill="none"
    stroke="#ffffff"
    stroke-width="14"
    stroke-linecap="round"
    opacity=".55"
  />

  <!-- Coffee -->
  <ellipse
    cx="420"
    cy="252"
    rx="143"
    ry="39"
    fill="url(#coffee)"
  />

  <!-- Coffee crema -->
  <ellipse
    cx="420"
    cy="247"
    rx="125"
    ry="28"
    fill="#a86c49"
    opacity=".28"
  />

  <!-- Latte art -->
  <g
    fill="none"
    stroke="#ead2ba"
    stroke-linecap="round"
  >

    <path
      d="M355 252
         C375 232 395 232 420 252
         C445 272 465 272 485 252"
      stroke-width="12"
    />

    <path
      d="M375 252
         C392 242 407 242 420 252
         C433 262 448 262 465 252"
      stroke-width="8"
    />

    <path
      d="M420 239
         C414 248 414 258 420 268
         C426 258 426 248 420 239"
      stroke-width="6"
    />

  </g>

  <!-- Handle -->
  <path
    d="M535 295
       C600 275 620 310 606 350
       C592 389 557 394 540 375"
    fill="none"
    stroke="#d9cbbb"
    stroke-width="27"
    stroke-linecap="round"
  />

  <path
    d="M546 301
       C585 294 596 316 587 342
       C579 365 560 369 548 360"
    fill="none"
    stroke="#593421"
    stroke-width="11"
    stroke-linecap="round"
  />

  <!-- Steam -->
  <g
    fill="none"
    stroke="#fff4e7"
    stroke-linecap="round"
    opacity=".35"
    filter="url(#soft)"
  >

    <path
      d="M360 205
       C330 175 375 150 350 120
       C330 95 355 70 375 55"
      stroke-width="9"
    />

    <path
      d="M420 200
       C395 170 440 145 418 115
       C400 90 425 68 445 50"
      stroke-width="8"
    />

    <path
      d="M480 205
       C455 175 500 150 480 122
       C463 98 490 75 510 62"
      stroke-width="7"
    />

  </g>

  <!-- Coffee bean decoration -->
  <g opacity=".7">

    <ellipse
      cx="135"
      cy="480"
      rx="18"
      ry="29"
      fill="#9b6444"
      transform="rotate(-28 135 480)"
    />

    <path
      d="M124 466 C145 476 145 491 137 505"
      fill="none"
      stroke="#d19a70"
      stroke-width="4"
      stroke-linecap="round"
    />

    <ellipse
      cx="690"
      cy="455"
      rx="18"
      ry="29"
      fill="#855237"
      transform="rotate(25 690 455)"
    />

    <path
      d="M678 440 C699 451 700 466 693 480"
      fill="none"
      stroke="#bd805b"
      stroke-width="4"
      stroke-linecap="round"
    />

  </g>

  <!-- Fine foreground texture -->
  <rect
    width="800"
    height="600"
    fill="#ffffff"
    opacity=".018"
  />

</svg>