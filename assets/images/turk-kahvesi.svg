<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E5D7CA"/>
      <stop offset="1" stop-color="#C1A794"/>
    </linearGradient>

    <linearGradient id="table" x1="0" y1="375" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#684634"/>
      <stop offset="1" stop-color="#35231A"/>
    </linearGradient>

    <linearGradient id="cezve" x1="315" y1="255" x2="500" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C58A4B"/>
      <stop offset="0.5" stop-color="#8B552E"/>
      <stop offset="1" stop-color="#4D2C1E"/>
    </linearGradient>

    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F7EEE4"/>
      <stop offset="1" stop-color="#D4C0AE"/>
    </linearGradient>

    <linearGradient id="coffee" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6B4029"/>
      <stop offset="1" stop-color="#2F1B13"/>
    </linearGradient>

    <radialGradient id="light" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(145 125) rotate(48) scale(390 310)">
      <stop stop-color="#FFF8EE" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#FFF8EE" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="210" y="370" width="390" height="150" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="softShadow" x="280" y="245" width="270" height="250" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#background)"/>
  <rect width="800" height="600" fill="url(#light)"/>

  <!-- Window -->
  <rect x="70" y="65" width="220" height="225" rx="4" fill="#F8F0E7" fill-opacity="0.5"/>
  <rect x="93" y="88" width="174" height="179" fill="#B7C5BE" fill-opacity="0.23"/>
  <path d="M180 88V267" stroke="#FFF8EF" stroke-width="8" stroke-opacity="0.62"/>
  <path d="M93 177H267" stroke="#FFF8EF" stroke-width="8" stroke-opacity="0.62"/>

  <!-- Background accent -->
  <circle cx="666" cy="125" r="78" fill="#A8795C" fill-opacity="0.12"/>
  <circle cx="666" cy="125" r="48" fill="#FFF6E9" fill-opacity="0.2"/>

  <!-- Small plant -->
  <path d="M632 292C628 254 635 223 652 194"
        stroke="#59694D" stroke-width="6" stroke-linecap="round"/>

  <path d="M647 219C623 211 611 195 612 180C630 181 644 194 647 219Z"
        fill="#687957"/>

  <path d="M641 240C660 226 677 224 691 230C684 247 665 252 641 240Z"
        fill="#768664"/>

  <path d="M634 261C615 250 604 238 602 223C619 224 632 237 634 261Z"
        fill="#526549"/>

  <path d="M654 201C659 183 672 170 686 168C686 185 673 198 654 201Z"
        fill="#7D8C6A"/>

  <path d="M609 286H685L674 351H620L609 286Z" fill="#A56B4A"/>
  <ellipse cx="647" cy="286" rx="38" ry="10" fill="#774D38"/>

  <!-- Table -->
  <rect y="375" width="800" height="225" fill="url(#table)"/>
  <path d="M0 412C160 394 300 430 465 412C610 396 715 404 800 420"
        stroke="#8B6047" stroke-width="3" stroke-opacity="0.45"/>
  <path d="M0 493C178 474 320 507 491 488C630 472 716 481 800 494"
        stroke="#8B6047" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Main shadow -->
  <ellipse cx="400" cy="456" rx="155" ry="38"
           fill="#1D120D" fill-opacity="0.42" filter="url(#shadow)"/>

  <!-- Cezve saucer -->
  <ellipse cx="400" cy="430" rx="145" ry="48" fill="#D9C9BC"/>
  <ellipse cx="400" cy="424" rx="132" ry="41" fill="#FFFDF9"/>
  <ellipse cx="400" cy="421" rx="106" ry="28" fill="#EFE6DE"/>

  <!-- Cezve shadow -->
  <ellipse cx="402" cy="380" rx="92" ry="46"
           fill="#3A2318" fill-opacity="0.32" filter="url(#softShadow)"/>

  <!-- Turkish coffee cezve -->
  <path d="M330 278
           C335 262 350 252 370 250
           H448
           C468 252 483 262 488 278
           L475 382
           C470 410 443 425 404 425
           C365 425 338 410 333 382L330 278Z"
        fill="url(#cezve)"/>

  <!-- Cezve upper body -->
  <path d="M338 280C342 266 355 259 372 258H446C463 259 476 266 480 280L470 355C466 379 443 393 404 393C365 393 342 379 338 355L338 280Z"
        fill="#9B6338"
        fill-opacity="0.78"/>

  <!-- Cezve metal highlights -->
  <path d="M350 282L359 355C362 372 378 383 397 386"
        stroke="#E0AA68" stroke-width="8" stroke-linecap="round" stroke-opacity="0.48"/>

  <path d="M462 276L454 351"
        stroke="#4A291C" stroke-width="8" stroke-linecap="round" stroke-opacity="0.48"/>

  <path d="M374 259H446"
        stroke="#F1C27D" stroke-width="5" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Cezve rim -->
  <ellipse cx="409" cy="276" rx="80" ry="25" fill="#633A25"/>
  <ellipse cx="409" cy="271" rx="70" ry="19" fill="#3B2116"/>

  <!-- Coffee surface -->
  <ellipse cx="409" cy="269" rx="61" ry="15" fill="url(#coffee)"/>
  <ellipse cx="409" cy="267" rx="48" ry="10" fill="#4B291B"/>

  <!-- Coffee foam -->
  <path d="M367 269C377 260 391 259 409 266C426 259 441 261 451 270C442 279 426 282 409 278C391 282 376 279 367 269Z"
        fill="#7B4A2D"
        fill-opacity="0.7"/>

  <!-- Cezve handle -->
  <path d="M480 292C525 280 557 294 559 325C561 357 530 376 475 362"
        stroke="#4A2A1D" stroke-width="18" stroke-linecap="round"/>

  <path d="M484 300C520 291 543 302 544 324C545 346 524 358 480 351"
        stroke="#B77B43" stroke-width="6" stroke-linecap="round"/>

  <!-- Long handle -->
  <path d="M335 275L283 216"
        stroke="#5A3523" stroke-width="13" stroke-linecap="round"/>

  <path d="M331 273L286 220"
        stroke="#C08A4E" stroke-width="5" stroke-linecap="round" stroke-opacity="0.65"/>

  <!-- Coffee cup -->
  <path d="M250 394
           C252 382 262 375 276 375
           H327
           C341 375 351 382 353 394
           L347 434
           C345 451 332 460 301 460
           C270 460 257 451 255 434L250 394Z"
        fill="url(#cup)"/>

  <ellipse cx="301" cy="394" rx="52" ry="17" fill="#E1D2C5"/>
  <ellipse cx="301" cy="390" rx="45" ry="13" fill="#FFFDF9"/>
  <ellipse cx="301" cy="389" rx="38" ry="10" fill="url(#coffee)"/>
  <ellipse cx="301" cy="387" rx="28" ry="6" fill="#4C291C"/>

  <!-- Cup handle -->
  <path d="M347 402C371 398 384 407 382 423C380 440 366 447 345 442"
        stroke="#F3EAE1" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- Turkish coffee steam -->
  <path d="M289 367C280 353 291 342 287 330C284 319 290 309 299 301"
        stroke="#FFF8EF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.52"/>

  <path d="M310 365C302 351 312 341 309 329C306 319 312 310 321 303"
        stroke="#FFF8EF" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Turkish delight -->
  <rect x="525" y="398" width="72" height="52" rx="7" fill="#E4B5A7"/>
  <rect x="532" y="390" width="72" height="52" rx="7" fill="#D78F7E"/>
  <path d="M540 399L596 399" stroke="#F6D8C9" stroke-width="5" stroke-linecap="round"/>
  <path d="M542 416L584 416" stroke="#F1C9B9" stroke-width="4" stroke-linecap="round"/>
  <path d="M542 431L574 431" stroke="#F1C9B9" stroke-width="4" stroke-linecap="round"/>

  <!-- Small water glass -->
  <path d="M602 335H655L648 405C646 417 637 423 629 423C620 423 611 417 609 405L602 335Z"
        fill="#EEF5F1" fill-opacity="0.34"
        stroke="#F8F4EE" stroke-width="3"/>

  <ellipse cx="628" cy="336" rx="26" ry="7" fill="#F8F4EE" fill-opacity="0.42"/>
  <path d="M607 367H651" stroke="#DCE9E4" stroke-width="4" stroke-opacity="0.55"/>

  <!-- Coffee beans -->
  <g opacity="0.7">
    <ellipse cx="184" cy="465" rx="14" ry="8"
             transform="rotate(-27 184 465)" fill="#4A2B1F"/>
    <path d="M175 468C182 463 189 461 195 462"
          stroke="#A87859" stroke-width="2"/>

    <ellipse cx="625" cy="480" rx="14" ry="8"
             transform="rotate(22 625 480)" fill="#4A2B1F"/>
    <path d="M616 477C623 480 629 481 635 479"
          stroke="#A87859" stroke-width="2"/>
  </g>

  <!-- Small spoon -->
  <g opacity="0.75">
    <path d="M210 405L260 460"
          stroke="#D8D0C8" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="202" cy="397" rx="14" ry="10"
             transform="rotate(42 202 397)"
             fill="#E9E1D9"/>
  </g>

  <!-- Foreground texture -->
  <path d="M65 550C175 531 250 566 355 551C475 534 565 570 735 545"
        stroke="#98684D" stroke-width="2" stroke-opacity="0.23"/>

  <!-- Ambient highlight -->
  <ellipse cx="400" cy="220" rx="185" ry="95"
           fill="#FFF5E6" fill-opacity="0.06"/>
</svg>