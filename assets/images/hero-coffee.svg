<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1600 1000"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">MOLA Coffee &amp; Kitchen kahve illüstrasyonu</title>

  <desc id="desc">
    Sıcak kahve tonlarında, modern bir kafe tezgahını ve
    latte fincanını temsil eden editorial SVG illüstrasyonu.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24150f"/>
      <stop offset="48%" stop-color="#4b2b1d"/>
      <stop offset="100%" stop-color="#160d09"/>
    </linearGradient>

    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b3d25"/>
      <stop offset="100%" stop-color="#2c170f"/>
    </linearGradient>

    <radialGradient id="light">
      <stop offset="0%" stop-color="#d7a06f" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#d7a06f" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf2"/>
      <stop offset="100%" stop-color="#d9c9b9"/>
    </linearGradient>

    <linearGradient id="coffee" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b4d2c"/>
      <stop offset="100%" stop-color="#3c1d12"/>
    </linearGradient>

    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#background)"/>

  <!-- Warm ambient light -->
  <ellipse
    cx="1110"
    cy="310"
    rx="520"
    ry="420"
    fill="url(#light)"
  />

  <!-- Subtle architectural shapes -->
  <rect
    x="980"
    y="90"
    width="470"
    height="500"
    rx="8"
    fill="#8c6249"
    opacity=".12"
  />

  <rect
    x="1040"
    y="140"
    width="350"
    height="390"
    fill="#d7bca4"
    opacity=".07"
  />

  <!-- Espresso machine silhouette -->
  <g opacity=".72">

    <rect
      x="1080"
      y="270"
      width="330"
      height="240"
      rx="16"
      fill="#21140f"
    />

    <rect
      x="1110"
      y="300"
      width="270"
      height="65"
      rx="8"
      fill="#60402e"
    />

    <rect
      x="1160"
      y="395"
      width="75"
      height="115"
      rx="8"
      fill="#392217"
    />

    <rect
      x="1260"
      y="395"
      width="75"
      height="115"
      rx="8"
      fill="#392217"
    />

    <circle
      cx="1197"
      cy="333"
      r="11"
      fill="#c99b6c"
    />

    <circle
      cx="1297"
      cy="333"
      r="11"
      fill="#c99b6c"
    />

    <rect
      x="1128"
      y="250"
      width="235"
      height="25"
      rx="12"
      fill="#987056"
    />

  </g>

  <!-- Background shelves -->
  <g opacity=".32">

    <rect
      x="120"
      y="170"
      width="500"
      height="16"
      rx="8"
      fill="#c19778"
    />

    <rect
      x="120"
      y="380"
      width="500"
      height="16"
      rx="8"
      fill="#c19778"
    />

    <circle
      cx="190"
      cy="130"
      r="38"
      fill="#c18c63"
    />

    <circle
      cx="290"
      cy="130"
      r="28"
      fill="#8d5b3e"
    />

    <circle
      cx="390"
      cy="130"
      r="42"
      fill="#b77b54"
    />

    <rect
      x="490"
      y="95"
      width="54"
      height="70"
      rx="10"
      fill="#d1ad91"
    />

    <rect
      x="190"
      y="310"
      width="100"
      height="48"
      rx="10"
      fill="#a97655"
    />

    <rect
      x="330"
      y="300"
      width="80"
      height="58"
      rx="10"
      fill="#6e4631"
    />

    <rect
      x="450"
      y="315"
      width="115"
      height="43"
      rx="10"
      fill="#bb8660"
    />

  </g>

  <!-- Counter -->
  <path
    d="M0 650
       C300 615 570 630 830 650
       C1120 675 1360 650 1600 620
       L1600 1000
       L0 1000 Z"
    fill="url(#counter)"
  />

  <!-- Counter highlight -->
  <path
    d="M0 670
       C300 635 570 650 830 670
       C1120 695 1360 670 1600 640"
    fill="none"
    stroke="#9a6342"
    stroke-width="8"
    opacity=".35"
  />

  <!-- Coffee shadow -->
  <ellipse
    cx="780"
    cy="770"
    rx="260"
    ry="65"
    fill="#130a06"
    opacity=".72"
    filter="url(#shadow)"
  />

  <!-- Saucer -->
  <ellipse
    cx="780"
    cy="755"
    rx="235"
    ry="55"
    fill="#d7c8b8"
  />

  <ellipse
    cx="780"
    cy="747"
    rx="205"
    ry="45"
    fill="#f4eee6"
  />

  <!-- Cup -->
  <path
    d="M600 570
       C605 530 640 510 690 510
       L870 510
       C920 510 955 530 960 570
       L940 730
       C935 775 900 800 850 805
       L710 805
       C660 800 625 775 620 730 Z"
    fill="url(#cup)"
  />

  <!-- Coffee surface -->
  <ellipse
    cx="780"
    cy="545"
    rx="172"
    ry="48"
    fill="url(#coffee)"
  />

  <!-- Latte art -->
  <path
    d="M690 545
       C720 520 750 520 780 545
       C810 570 840 570 870 545"
    fill="none"
    stroke="#d9b08c"
    stroke-width="13"
    stroke-linecap="round"
    opacity=".9"
  />

  <path
    d="M720 545
       C745 535 765 535 780 545
       C795 555 815 555 840 545"
    fill="none"
    stroke="#f0d5bd"
    stroke-width="8"
    stroke-linecap="round"
    opacity=".9"
  />

  <!-- Cup handle -->
  <path
    d="M925 595
       C1010 570 1040 620 1020 675
       C1000 725 950 730 925 700"
    fill="none"
    stroke="#d7c8b8"
    stroke-width="34"
    stroke-linecap="round"
  />

  <path
    d="M935 610
       C985 600 1005 625 995 660
       C985 690 960 695 940 680"
    fill="none"
    stroke="#4a2a1c"
    stroke-width="13"
    stroke-linecap="round"
  />

  <!-- Steam -->
  <g
    fill="none"
    stroke="#ead8c5"
    stroke-linecap="round"
    opacity=".32"
  >

    <path
      d="M705 470
       C670 425 735 400 705 350
       C680 310 720 285 750 270"
      stroke-width="13"
      filter="url(#soft)"
    />

    <path
      d="M785 470
       C750 425 815 400 790 355
       C765 315 810 285 835 260"
      stroke-width="12"
      filter="url(#soft)"
    />

    <path
      d="M865 475
       C835 430 895 405 875 365
       C855 325 895 300 920 280"
      stroke-width="10"
      filter="url(#soft)"
    />

  </g>

  <!-- Coffee tools -->
  <g opacity=".75">

    <rect
      x="1100"
      y="760"
      width="230"
      height="28"
      rx="14"
      fill="#c0a28d"
      transform="rotate(-8 1100 760)"
    />

    <circle
      cx="1130"
      cy="755"
      r="34"
      fill="#3a2117"
    />

    <circle
      cx="1130"
      cy="755"
      r="23"
      fill="#8a5b40"
    />

    <rect
      x="1270"
      y="825"
      width="150"
      height="20"
      rx="10"
      fill="#a77959"
      transform="rotate(15 1270 825)"
    />

  </g>

  <!-- Subtle foreground grain -->
  <rect
    width="1600"
    height="1000"
    fill="#fff"
    opacity=".025"
  />

</svg>