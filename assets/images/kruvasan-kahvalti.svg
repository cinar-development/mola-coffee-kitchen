    <ellipse cx="715" cy="475" rx="14" ry="8"
             transform="rotate(22 715 475)" fill="#4A2B1F"/>
    <path d="M706 472C713 475 719 476 725 474"
          stroke="#A87859" stroke-width="2"/>
  </g>

  <!-- Small knife -->
  <g opacity="0.72">
    <path d="M670 365L731 421"
          stroke="#D8D0C8" stroke-width="5" stroke-linecap="round"/>
    <path d="M666 361L712 401L721 392L675 352Z"
