  <!-- Butter -->
  <rect x="625" y="485" width="74" height="48" rx="6" fill="#E7C978"/>
  <rect x="632" y="478" width="74" height="48" rx="6" fill="#F1D990"/>
  <path d="M640 490H695" stroke="#FFF0B7" stroke-width="4" stroke-linecap="round"/>
  <path d="M640 505H685" stroke="#D3A957" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55"/>

  <!-- Coffee beans -->
  <g opacity="0.68">
    <ellipse cx="112" cy="487" rx="14" ry="8"
