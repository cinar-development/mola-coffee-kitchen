  <ellipse cx="290" cy="405" rx="29" ry="16" transform="rotate(-18 290 405)" fill="#B95D3F"/>
  <ellipse cx="292" cy="402" rx="20" ry="9" transform="rotate(-18 292 402)" fill="#E18762"/>
  <path d="M281 403L295 399" stroke="#F0B292" stroke-width="3" stroke-linecap="round"/>

  <ellipse cx="493" cy="414" rx="29" ry="16" transform="rotate(18 493 414)" fill="#B95D3F"/>
  <ellipse cx="491" cy="411" rx="20" ry="9" transform="rotate(18 491 411)" fill="#E18762"/>
  <path d="M484 411L498 415" stroke="#F0B292" stroke-width="3" stroke-linecap="round"/>

