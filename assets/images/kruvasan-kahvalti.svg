  <ellipse cx="635" cy="406" rx="30" ry="10" fill="#FFFDF9"/>
  <ellipse cx="635" cy="404" rx="25" ry="7" fill="#A84E38"/>
  <path d="M620 405C628 401 636 401 644 405"
