<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E9DED3"/>
      <stop offset="1" stop-color="#C9B3A0"/>
    </linearGradient>

    <linearGradient id="table" x1="0" y1="375" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#694735"/>
      <stop offset="1" stop-color="#37241B"/>
    </linearGradient>

    <linearGradient id="plate" x1="250" y1="330" x2="550" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#E1D5CB"/>
    </linearGradient>

    <linearGradient id="croissant" x1="275" y1="260" x2="530" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0B86D"/>
      <stop offset="0.55" stop-color="#C87B3E"/>
      <stop offset="1" stop-color="#8B4C2C"/>
    </linearGradient>

    <linearGradient id="egg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF7D9"/>
      <stop offset="1" stop-color="#E6C987"/>
    </linearGradient>

    <radialGradient id="light" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(145 125) rotate(48) scale(390 310)">
      <stop stop-color="#FFF9EF" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#FFF9EF" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="215" y="365" width="390" height="145" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="foodShadow" x="250" y="245" width="310" height="220" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#background)"/>
  <rect width="800" height="600" fill="url(#light)"/>

  <!-- Window -->
  <rect x="70" y="65" width="220" height="225" rx="4" fill="#F8F1E8" fill-opacity="0.5"/>
  <rect x="93" y="88" width="174" height="179" fill="#B8C6C0" fill-opacity="0.24"/>
  <path d="M180 88V267" stroke="#FFF8EF" stroke-width="8" stroke-opacity="0.62"/>
  <path d="M93 177H267" stroke="#FFF8EF" stroke-width="8" stroke-opacity="0.62"/>

  <!-- Wall accent -->
  <circle cx="666" cy="125" r="78" fill="#A8795C" fill-opacity="0.12"/>
  <circle cx="666" cy="125" r="48" fill="#FFF6E9" fill-opacity="0.2"/>

