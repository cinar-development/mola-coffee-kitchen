  <!-- Egg -->
  <ellipse cx="555" cy="385" rx="61" ry="34" fill="#D7C7B9" fill-opacity="0.35"/>
  <path d="M515 377C518 357 537 344 556 347C577 341 597 355 600 376C603 398 585 411 564 413C543 416 516 402 515 377Z"
