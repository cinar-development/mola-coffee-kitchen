  <path d="M481 285C471 299 468 314 472 329C476 343 473 355 462 367"
        stroke="#A96334" stroke-width="7" stroke-linecap="round" stroke-opacity="0.66"/>

  <!-- Croissant highlights -->
  <path d="M300 306C310 286 325 274 344 269"
