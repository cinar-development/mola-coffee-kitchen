<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8DED3"/>
      <stop offset="1" stop-color="#C8B5A4"/>
    </linearGradient>

    <linearGradient id="table" x1="0" y1="370" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#694735"/>
      <stop offset="1" stop-color="#38251C"/>
    </linearGradient>

    <linearGradient id="cup" x1="300" y1="245" x2="510" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#D9CEC4"/>
    </linearGradient>

    <linearGradient id="coffee" x1="330" y1="275" x2="470" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5738"/>
      <stop offset="1" stop-color="#4A2B20"/>
    </linearGradient>

    <radialGradient id="light" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(145 125) rotate(48) scale(390 310)">
      <stop stop-color="#FFF9EF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFF9EF" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="220" y="350" width="360" height="140" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="cupShadow" x="270" y="240" width="270" height="240" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#background)"/>
  <rect width="800" height="600" fill="url(#light)"/>

  <!-- Window -->
  <rect x="72" y="64" width="220" height="225" rx="4" fill="#F8F1E8" fill-opacity="0.5"/>
  <rect x="94" y="87" width="176" height="180" fill="#B9C7C1" fill-opacity="0.24"/>
  <path d="M182 87V267" stroke="#FFF8EF" stroke-width="8" stroke-opacity="0.62"/>
  <path d="M94 177H270" stroke="#FFF8EF" stroke-width="8" stroke-opacity="0.62"/>

  <!-- Background wall accent -->
  <circle cx="665" cy="125" r="78" fill="#A8795C" fill-opacity="0.12"/>
  <circle cx="665" cy="125" r="48" fill="#FFF6E9" fill-opacity="0.2"/>

  <!-- Small plant -->
  <path d="M635 294C630 256 637 223 654 193"
        stroke="#59694D" stroke-width="6" stroke-linecap="round"/>

  <path d="M649 219C625 211 613 195 614 180C632 181 646 194 649 219Z"
        fill="#697A59"/>

  <path d="M643 239C662 225 679 223 693 229C686 246 667 251 643 239Z"
        fill="#778765"/>

  <path d="M636 260C617 249 606 237 604 222C621 223 634 236 636 260Z"
        fill="#536649"/>

  <path d="M656 201C661 183 674 169 688 168C688 185 675 198 656 201Z"
        fill="#7E8D6B"/>

  <path d="M610 286H686L675 351H621L610 286Z" fill="#A56B4A"/>
  <ellipse cx="648" cy="286" rx="38" ry="10" fill="#774D38"/>

  <!-- Table -->
  <rect y="375" width="800" height="225" fill="url(#table)"/>
  <path d="M0 411C160 393 303 430 465 412C610 396 715 404 800 419"
        stroke="#8B6047" stroke-width="3" stroke-opacity="0.45"/>
  <path d="M0 492C178 474 320 507 491 488C630 472 716 481 800 494"
        stroke="#8B6047" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Cup shadow -->
  <ellipse cx="400" cy="452" rx="145" ry="34"
           fill="#1D120D" fill-opacity="0.42" filter="url(#shadow)"/>

  <!-- Saucer -->
  <ellipse cx="400" cy="433" rx="150" ry="50" fill="#E5DBD2"/>
  <ellipse cx="400" cy="427" rx="137" ry="43" fill="#FFFDF9"/>
  <ellipse cx="400" cy="425" rx="110" ry="30" fill="#F1EAE3"/>

  <!-- Cup soft shadow -->
  <ellipse cx="400" cy="388" rx="118" ry="46"
           fill="#3B2419" fill-opacity="0.3" filter="url(#cupShadow)"/>

  <!-- Flat white cup -->
  <path d="M298 286
           C300 267 316 254 338 250
           H462
           C484 254 500 267 502 286
           L490 388
           C487 416 454 433 400 433
           C346 433 313 416 310 388
           L298 286Z"
        fill="url(#cup)"/>

  <!-- Cup lower warm reflection -->
  <path d="M312 350C323 397 348 417 400 421C452 417 477 397 488 350L482 389C478 410 451 425 400 428C349 425 322 410 318 389L312 350Z"
        fill="#D5C4B6"
        fill-opacity="0.45"/>

  <!-- Cup rim -->
  <ellipse cx="400" cy="280" rx="103" ry="34" fill="#E7DDD5"/>
  <ellipse cx="400" cy="275" rx="92" ry="28" fill="#FFFDF9"/>

  <!-- Coffee -->
  <ellipse cx="400" cy="274" rx="82" ry="23" fill="url(#coffee)"/>
  <ellipse cx="400" cy="272" rx="69" ry="17" fill="#6D422C"/>

  <!-- Flat white crema -->
  <path d="M353 273C365 261 385 258 400 269C415 258 435 261 447 273C437 285 420 289 400 283C380 289 363 285 353 273Z"
        fill="#D8B79B"/>

  <!-- Latte art -->
  <path d="M378 268C384 262 394 260 400 267C406 260 416 262 422 268C416 274 409 277 400 276C391 277 384 274 378 268Z"
        fill="#F0D9C1"/>

  <path d="M390 273C394 269 397 268 400 272C403 268 406 269 410 273C406 277 403 279 400 278C397 279 394 277 390 273Z"
        fill="#FFF0DB"/>

  <!-- Handle -->
  <path d="M493 304C538 298 563 317 558 350C553 382 526 396 488 385"
        stroke="#F5EEE7" stroke-width="18" fill="none" stroke-linecap="round"/>

  <path d="M497 317C527 313 543 325 539 348C535 369 518 378 493 372"
        stroke="#CDBEB2" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- Steam -->
  <path d="M370 240C360 224 372 211 367 197C363 185 369 175 379 166"
        stroke="#FFF8EF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.55"/>

  <path d="M400 239C390 222 402 210 398 197C394 186 400 175 410 166"
        stroke="#FFF8EF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.5"/>

  <path d="M430 240C420 224 432 212 428 199C425 188 431 180 439 172"
        stroke="#FFF8EF" stroke-width="4" stroke-linecap="round" stroke-opacity="0.38"/>

  <!-- Coffee beans -->
  <g opacity="0.68">
    <ellipse cx="192" cy="448" rx="14" ry="8"
             transform="rotate(-27 192 448)" fill="#4A2B1F"/>
    <path d="M183 451C190 446 197 444 203 445"
          stroke="#A87859" stroke-width="2"/>

    <ellipse cx="618" cy="470" rx="14" ry="8"
             transform="rotate(22 618 470)" fill="#4A2B1F"/>
    <path d="M609 467C616 470 622 471 628 469"
          stroke="#A87859" stroke-width="2"/>
  </g>

  <!-- Small spoon -->
  <g opacity="0.72">
    <path d="M247 400L306 455"
          stroke="#D9D0C8" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="239" cy="393" rx="14" ry="10"
             transform="rotate(42 239 393)"
             fill="#E9E1D9"/>
  </g>

  <!-- Foreground texture -->
  <path d="M65 550C175 531 250 566 355 551C475 534 565 570 735 545"
        stroke="#98684D" stroke-width="2" stroke-opacity="0.23"/>

  <!-- Ambient highlight -->
  <ellipse cx="400" cy="230" rx="185" ry="95"
           fill="#FFF5E6" fill-opacity="0.06"/>
</svg>