  <path d="M562 191H597V204H562V191Z" fill="#F0DED0" fill-opacity="0.7"/>
  <path d="M570 211H590" stroke="#F0DED0" stroke-width="3" stroke-linecap="round"/>

  <path d="M635 178H682L687 226H630L635 178Z" fill="#D4B394"/>
