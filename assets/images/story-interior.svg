  <path d="M565 281H775" stroke="#B9B1AB" stroke-width="3" stroke-opacity="0.38"/>
  <circle cx="586" cy="307" r="4" fill="#D0A06E"/>
  <circle cx="650" cy="307" r="4" fill="#D0A06E"/>
  <circle cx="714" cy="307" r="4" fill="#D0A06E"/>

