  <path d="M20 690C190 672 350 703 520 682C690 661 830 684 980 676"
        stroke="#8C6048" stroke-width="2" stroke-opacity="0.18"/>

  <!-- Foreground table -->
  <path d="M95 515C210 492 350 505 455 525C520 538 595 534 670 520C760 503 850 506 930 527L895 610C760 585 650 586 520 602C375 620 220 588 110 605L95 515Z"
