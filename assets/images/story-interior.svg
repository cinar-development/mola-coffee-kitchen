  <rect x="545" y="272" width="250" height="72" rx="10" fill="url(#machine)"/>
  <rect x="560" y="286" width="220" height="45" rx="7" fill="#4B4642"/>
  <rect x="578" y="295" width="48" height="24" rx="4" fill="#181716"/>
  <rect x="642" y="295" width="48" height="24" rx="4" fill="#181716"/>
  <rect x="706" y="295" width="48" height="24" rx="4" fill="#181716"/>

