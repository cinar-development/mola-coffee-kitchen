<svg width="1000" height="750" viewBox="0 0 1000 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1000" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEE4DA"/>
      <stop offset="1" stop-color="#CBB7A6"/>
    </linearGradient>

    <linearGradient id="floor" x1="0" y1="500" x2="0" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76513C"/>
      <stop offset="1" stop-color="#39261D"/>
    </linearGradient>

    <linearGradient id="counter" x1="0" y1="430" x2="1000" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#51372A"/>
      <stop offset="1" stop-color="#2E211A"/>
    </linearGradient>

    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9B6A4D"/>
      <stop offset="1" stop-color="#5B3C2C"/>
    </linearGradient>

    <linearGradient id="machine" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#77706B"/>
      <stop offset="0.5" stop-color="#373331"/>
      <stop offset="1" stop-color="#171514"/>
    </linearGradient>

    <radialGradient id="windowLight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(235 185) rotate(48) scale(420 360)">
      <stop stop-color="#FFF9EF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF9EF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#DCE8E3" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#9EADA7" stop-opacity="0.22"/>
    </linearGradient>

    <filter id="counterShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Interior background -->
  <rect width="1000" height="750" fill="url(#wall)"/>
  <rect width="1000" height="750" fill="url(#windowLight)"/>

  <!-- Ceiling -->
  <rect width="1000" height="70" fill="#F6EEE5"/>
  <path d="M0 70H1000" stroke="#D5C5B7" stroke-width="2"/>

  <!-- Large café window -->
  <rect x="85" y="105" width="345" height="350" rx="4" fill="#F9F4EC" fill-opacity="0.55"/>
  <rect x="108" y="128" width="299" height="304" fill="url(#glass)"/>

  <!-- Window frame -->
  <path d="M257 128V432" stroke="#EDE3D9" stroke-width="11"/>
  <path d="M108 280H407" stroke="#EDE3D9" stroke-width="11"/>
  <path d="M108 128H407V432H108V128Z" stroke="#D5C5B7" stroke-width="5"/>

  <!-- Exterior suggestion -->
  <path d="M108 355C165 318 205 332 258 350C313 369 355 365 407 330V432H108V355Z"
