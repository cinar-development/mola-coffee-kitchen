  <!-- Menu card -->
  <rect x="735" y="520" width="110" height="74" rx="5" fill="#F5EDE3"/>
  <rect x="750" y="534" width="80" height="5" rx="2.5" fill="#A85C32" fill-opacity="0.75"/>
  <rect x="750" y="550" width="62" height="4" rx="2" fill="#75665D" fill-opacity="0.55"/>
  <rect x="750" y="563" width="70" height="4" rx="2" fill="#75665D" fill-opacity="0.4"/>
  <rect x="750" y="576" width="48" height="4" rx="2" fill="#75665D" fill-opacity="0.35"/>

  <!-- Decorative plant in foreground -->
  <path d="M900 470C895 430 902 402 920 378"
        stroke="#58684E" stroke-width="7" stroke-linecap="round"/>
  <path d="M913 409C891 401 880 385 881 370C899 372 911 387 913 409Z"
