  <rect x="827" y="250" width="52" height="42" rx="5" fill="#413A35"/>
  <rect x="837" y="258" width="32" height="25" rx="3" fill="#171514"/>
  <circle cx="853" cy="316" r="9" fill="#A85C32"/>

