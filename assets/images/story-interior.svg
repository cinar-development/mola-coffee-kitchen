  <rect x="455" y="370" width="485" height="22" rx="5" fill="#211914"/>
  <path d="M470 377H925" stroke="#9B6A4D" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Coffee cup on counter -->
  <ellipse cx="515" cy="416" rx="52" ry="14" fill="#1E140F" fill-opacity="0.28" filter="url(#softShadow)"/>
  <ellipse cx="515" cy="404" rx="43" ry="12" fill="#F8F0E7"/>
  <path d="M482 401C485 426 495 438 515 438C535 438 545 426 548 401H482Z"
